# Render（render.com）の設定ファイル。
# ダッシュボードの New → Blueprint でこのリポジトリを選ぶと、この内容で静的サイトが作られる。
# ビルドは不要なので、リポジトリのファイルをそのまま公開する。
services:
  - type: web
    runtime: static
    name: math-apps
    branch: main
    # main ブランチにコミットが入るたびに、自動で公開し直す
    autoDeployTrigger: commit
    buildCommand: echo "ビルドは不要です"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
