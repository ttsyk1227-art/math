<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>場合の数 考え方まとめ（プリント）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@700&display=swap">
  <style>
    /* A4 縦のプリント。1〜2ページ目がまとめ、3ページ目が確認テスト、4ページ目が解答 */
    :root {
      --ink: #1b2430;
      --muted: #5d6b78;
      --line: #b9c4cd;
      --soft: #eef2f5;
      --accent: #b4441c;
      --line-g: #1f6f8b;
      --pick-g: #2e7d32;
      --split-g: #8e3b9e;
    }
    @page { size: A4; margin: 11mm 12mm; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #ffffff;
      color: var(--ink);
      font-family: "Zen Kaku Gothic New", "IPAGothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 8.8pt;
      line-height: 1.42;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet { max-width: 186mm; margin: 0 auto; padding: 8mm 0; }
    @media screen { body { background: #e7ebee; } .sheet { background: #fff; padding: 12mm; margin: 12px auto; box-shadow: 0 1px 4px rgb(0 0 0 / 0.12); } }
    @media print { .no-print { display: none !important; } .sheet { padding: 0; } }
    .page-break { break-before: page; }

    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2.5px solid var(--ink); padding-bottom: 4px; }
    h1 { font-family: "Zen Maru Gothic", "IPAGothic", sans-serif; font-size: 19pt; margin: 0; line-height: 1.2; }
    .sub { color: var(--muted); font-size: 9pt; margin: 0 0 2px; }
    .name { font-size: 9.5pt; white-space: nowrap; }
    .name span { display: inline-block; border-bottom: 1px solid var(--ink); min-width: 9mm; text-align: center; }
    .name .n { min-width: 34mm; }

    h2 { font-size: 11.5pt; margin: 9px 0 4px; display: flex; align-items: center; gap: 6px; }
    h2 .badge { color: #fff; padding: 0 8px; border-radius: 4px; font-size: 10pt; }
    h2 small { font-weight: 400; color: var(--muted); font-size: 8.5pt; }

    .flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 6px; }
    .flow div { border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
    .flow b.step { color: var(--accent); font-size: 8pt; display: block; letter-spacing: 0.05em; }
    .flow .t { font-weight: 700; display: block; }
    .flow p { margin: 2px 0 0; font-size: 8.4pt; }

    .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px 10px; font-size: 8.4pt; margin: 2px 0; }
    .tools b { color: var(--accent); }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 1px solid var(--line); padding: 2px 5px; vertical-align: middle; }
    th { background: var(--soft); font-size: 8.4pt; }
    td.cond b { display: block; }
    td.cond small { color: var(--muted); font-size: 7.8pt; }
    td.f { text-align: center; }
    td.ex { font-size: 8.4pt; }
    td.ex .a { display: block; font-weight: 700; }
    tr { break-inside: avoid; }
    col.c1 { width: 30%; } col.c2 { width: 27%; } col.c3 { width: 15%; } col.c4 { width: 28%; }

    .nt { font-family: "Cambria Math", "Times New Roman", "IPAMincho", serif; white-space: nowrap; }
    .nt sub, .nt sup { font-size: 0.7em; }
    .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.25; }
    .frac > span { padding: 0 3px; }
    .frac > span:last-child { border-top: 1px solid currentColor; }

    .pitfalls { border: 1.5px solid var(--accent); border-radius: 6px; padding: 5px 10px; margin-top: 9px; }
    .pitfalls h2 { margin: 0 0 2px; color: var(--accent); }
    .pitfalls ul { margin: 0; padding-left: 1.2em; columns: 2; column-gap: 16px; font-size: 8.6pt; }

    .test { list-style: none; padding: 0; margin: 6px 0 0; counter-reset: q; }
    .test li { counter-increment: q; border-bottom: 1px dashed var(--line); padding: 5px 0 5px 2.2em; position: relative; min-height: 15mm; display: grid; grid-template-columns: 1fr 34mm; gap: 8px; break-inside: avoid; }
    .test li::before { content: "(" counter(q) ")"; position: absolute; left: 0; font-weight: 700; }
    .test .box { border: 1px solid var(--ink); height: 10mm; align-self: end; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 3px; font-size: 8pt; color: var(--muted); }
    .test .tag { color: var(--muted); font-size: 7.8pt; }
    .answers { list-style: none; padding: 0; margin: 6px 0 0; counter-reset: q; }
    .answers > li { counter-increment: q; padding: 4px 0 4px 2.2em; position: relative; border-bottom: 1px dashed var(--line); break-inside: avoid; font-size: 8.8pt; }
    .answers > li::before { content: "(" counter(q) ")"; position: absolute; left: 0; font-weight: 700; }
    .answers .a { font-weight: 700; color: var(--accent); }
    .answers ol { margin: 2px 0 0; padding-left: 1.4em; }
    .group-break { break-before: page; }

    .toolbar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; justify-content: center; padding: 10px; background: #1b2430; }
    .toolbar button, .toolbar a { font: inherit; font-size: 10.5pt; font-weight: 700; padding: 6px 14px; border-radius: 6px; border: 0; background: #fff; color: #1b2430; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <button type="button" onclick="window.print()">印刷する</button>
    <button type="button" id="reroll">確認テストの問題を作り直す</button>
    <a href="./">練習アプリへ</a>
  </div>

  <div class="sheet">
    <header>
      <div>
        <p class="sub">数学A ・ 場合の数</p>
        <h1>条件でわかる！場合の数の考え方まとめ</h1>
      </div>
      <p class="name"><span></span>年 <span></span>組 <span></span>番　名前 <span class="n"></span></p>
    </header>

    <h2>見分ける4ステップ</h2>
    <div class="flow" id="flow"></div>

    <h2>いつでも使える8つの考え方</h2>
    <div class="tools" id="tools"></div>

    <div id="tables"></div>

    <div class="pitfalls">
      <h2>まちがえやすいポイント</h2>
      <ul id="pitfalls"></ul>
    </div>
  </div>

  <div class="sheet page-break">
    <header>
      <div>
        <p class="sub">数学A ・ 場合の数</p>
        <h1>確認テスト</h1>
      </div>
      <p class="name"><span></span>年 <span></span>組 <span></span>番　名前 <span class="n"></span></p>
    </header>
    <p class="sub" style="margin-top:6px">まず、どの考え方を使うかを決めてから計算しよう。（各パターンから1問ずつ・全<span id="test-count"></span>問）</p>
    <ol class="test" id="test"></ol>
  </div>

  <div class="sheet page-break">
    <header>
      <div>
        <p class="sub">数学A ・ 場合の数</p>
        <h1>確認テスト 解答</h1>
      </div>
    </header>
    <ol class="answers" id="answers"></ol>
  </div>

  <script src="data.js"></script>
  <script>
    'use strict';
    // 確認テストは同じ問題を印刷できるように、乱数の種を URL（?seed=）で固定する
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const params = new URLSearchParams(location.search);
    const seed = Number(params.get('seed')) || 2026;
    Math.random = mulberry32(seed);

    const GROUP_COLOR = { line: 'var(--line-g)', pick: 'var(--pick-g)', split: 'var(--split-g)' };

    document.getElementById('flow').innerHTML = FLOW.map((f) => `<div><b class="step">${f.step}</b><span class="t">${f.title}</span><p>${f.body}</p></div>`).join('');
    document.getElementById('tools').innerHTML = TOOLS.map(([t, d]) => `<div><b>${t}</b>：${d}</div>`).join('');
    document.getElementById('pitfalls').innerHTML = PITFALLS.map((p) => `<li>${p}</li>`).join('');

    document.getElementById('tables').innerHTML = Object.entries(GROUPS).map(([g, info]) => `
      <h2 class="${g === 'pick' ? 'group-break' : ''}"><span class="badge" style="background:${GROUP_COLOR[g]}">${info.name}</span><small>${info.desc}</small></h2>
      <table>
        <colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"></colgroup>
        <tr><th>条件（問題文のサイン）</th><th>考え方</th><th>式</th><th>例 → 答え</th></tr>
        ${PATTERNS.filter((p) => p.g === g).map((p) => `
          <tr>
            <td class="cond"><b>${p.cond}</b><small>${p.sign}</small></td>
            <td>${p.idea}</td>
            <td class="f">${p.formula}</td>
            <td class="ex">${p.ex}<span class="a">${p.exA}</span></td>
          </tr>`).join('')}
      </table>`).join('');

    // 確認テスト：各パターンから1問ずつ
    const test = PATTERNS.map((p) => ({ p, ...p.gen() }));
    document.getElementById('test-count').textContent = test.length;
    document.getElementById('test').innerHTML = test.map((t) => `
      <li><span>${t.q} <span class="tag">［${GROUPS[t.p.g].name}］</span></span><span class="box">${t.unit || '通り'}</span></li>`).join('');
    document.getElementById('answers').innerHTML = test.map((t) => `
      <li><span class="a">${fmt(t.ans)}${t.unit || '通り'}</span>　考え方：${t.p.short}（${t.p.cond}）
        <ol>${t.steps.map((s) => `<li>${s}</li>`).join('')}</ol></li>`).join('');

    document.getElementById('reroll').addEventListener('click', () => {
      params.set('seed', String(Math.floor(Date.now() % 100000)));
      location.search = params.toString();
    });
  </script>
</body>
</html>
